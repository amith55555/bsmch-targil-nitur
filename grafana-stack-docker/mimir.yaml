multitenancy_enabled: true

server:
  http_listen_port: 9009

blocks_storage:
  backend: filesystem
  bucket_store:
    sync_dir: /tmp/mimir/tsdb-sync
  filesystem:
    dir: /tmp/mimir/data

compactor:
  data_dir: /tmp/mimir/compactor


ingester:
  ring:
    replication_factor: 1

# Configure the store-gateway to only require 1 replica
store_gateway:
  sharding_ring:
    replication_factor: 1
